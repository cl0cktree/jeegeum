<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns="http://w3.org" xmlns:epub="http://idpf.org" xml:lang="ko" lang="ko">
    <head>
        <meta charset="utf-8" />
        <title>EPUB 3.0 인터랙티브 샘플</title>
        <!-- 외부 스타일시트 연결 -->
        <link rel="stylesheet" type="text/css" href="./css/styles.css" />
        <!-- 외부 자바스크립트 연결 -->
        <script type="text/javascript" src="./js/script.js" defer="defer"></script>
    </head>
    <body>

        <section class="chapter">
            <h1 class="title">EPUB 3.0 인터랙티브 북</h1>
            <p class="description">아래의 카드를 클릭하여 정답을 확인해보세요.</p>

            <!-- 퀴즈 박스 영역 -->
            <div class="quiz-container">
                <div class="quiz-card" id="quizCard">
                    <!-- 카드 앞면 (질문) -->
                    <div class="card-face front">
                        <h2>Q. EPUB 3.0에서 멀티미디어를 구현하는 핵심 기술 3가지는?</h2>
                        <p class="hint">클릭하면 정답이 나타납니다.</p>
                    </div>
                    <!-- 카드 뒷면 (정답) -->
                    <div class="card-face back">
                        <h2>A. HTML5, CSS3, JavaScript</h2>
                        <p class="explanation">이 세 가지 기술을 통해 기존의 정적인 전자책을 넘어 애니메이션, 퀴즈, 게임 등 동적인 콘텐츠를 제작할 수 있습니다.</p>
                    </div>
                </div>
            </div>

            <!-- 하단 인터랙티브 버튼 영역 -->
            <div class="action-area">
                <button id="likeBtn" class="btn">👍 이 책이 마음에 들어요 (<span id="likeCount">0</span>)</button>
            </div>
        </section>

    </body>
</html>
